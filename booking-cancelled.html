<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cancel Booking | Costa Blanca Tour</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #faf6f1;
      color: #2f2117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      max-width: 480px;
      width: 100%;
      background: #fff;
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 50px rgba(100,60,20,0.08);
      text-align: center;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    .subtitle {
      color: #7a6b5d;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      padding: 0.75rem 2rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-danger {
      background: rgba(239,68,68,0.1);
      color: #dc2626;
      border: 1px solid rgba(239,68,68,0.2);
      margin-bottom: 1rem;
    }
    .btn-danger:hover { background: rgba(239,68,68,0.15); }
    .btn-back {
      background: #d4853b;
      color: #fff;
    }
    .btn-back:hover { background: #e9a05c; }
    #result { display: none; }
    .error { color: #dc2626; margin-bottom: 1rem; }
    .success-icon {
      width: 3.5rem; height: 3.5rem;
      margin: 0 auto 1.2rem;
      background: rgba(239,68,68,0.08);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="confirm-view">
      <h1>Cancel Your Booking?</h1>
      <p class="subtitle">Your card authorization will be released and no charge will be made.</p>
      <button class="btn btn-danger" id="cancelBtn" onclick="cancelBooking()">Yes, Cancel My Booking</button>
      <br />
      <a class="btn btn-back" href="/">Keep My Booking</a>
    </div>
    <div id="result">
      <div class="success-icon">&#10005;</div>
      <h1 id="resultTitle">Booking Cancelled</h1>
      <p class="subtitle" id="resultMsg">Your reservation has been cancelled and no charge will be made.</p>
      <a class="btn btn-back" href="/">Back to Homepage</a>
    </div>
  </div>
  <script>
    async function cancelBooking() {
      const params = new URLSearchParams(window.location.search);
      const bookingId = params.get('booking_id');
      const email = params.get('email');

      if (!bookingId || !email) {
        alert('Invalid cancellation link.');
        return;
      }

      const btn = document.getElementById('cancelBtn');
      btn.textContent = 'Cancelling...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/cancel-booking', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ booking_id: bookingId, customer_email: email }),
        });

        const data = await resp.json();

        document.getElementById('confirm-view').style.display = 'none';
        document.getElementById('result').style.display = 'block';

        if (!resp.ok) {
          document.getElementById('resultTitle').textContent = 'Cancellation Failed';
          document.getElementById('resultMsg').textContent = data.error || 'Something went wrong. Please contact us.';
        }
      } catch {
        btn.textContent = 'Yes, Cancel My Booking';
        btn.disabled = false;
        alert('Network error. Please try again.');
      }
    }
  </script>
</body>
</html>
